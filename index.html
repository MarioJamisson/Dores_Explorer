<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dores Explorer | System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="explorer-container">
        <header>
            <button class="back-btn" id="backBtn" disabled title="Voltar">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
            </button>
            <div class="title-area" style="display: flex; align-items: center; gap: 0.5rem;">
                <div class="mascot-container" title="Olá! Eu sou o Dores, seu assistente poggers.">
                    <svg class="mascot-skull" viewBox="0 0 24 24" width="32" height="32">
                        <path
                            d="M12,2C7.03,2,3,6.03,3,11c0,3.31,1.81,6.21,4.5,7.74V20c0,1.1,0.9,2,2,2h5c1.1,0,2-0.9,2-2v-1.26c2.69-1.53,4.5-4.43,4.5-7.74 C21,6.03,16.97,2,12,2z M9,16c-0.55,0-1-0.45-1-1s0.45-1,1-1s1,0.45,1,1S9.55,16,9,16z M15,16c-0.55,0-1-0.45-1-1s0.45-1,1-1 s1,0.45,1,1S15.55,16,15,16z" />
                    </svg>
                </div>
                <h1>Dores Explorer</h1>
            </div>
            <div class="breadcrumb" id="breadcrumb">Meu Computador</div>
            <div class="deep-scan-toggle" style="display: flex; align-items: center; gap: 0.5rem; margin-right: 1rem;">
                <span style="font-size: 0.75rem; color: var(--text-dim);">Análise Profunda</span>
                <input type="checkbox" id="calcSizesToggle" style="accent-color: var(--primary); cursor: pointer;">
            </div>
            <button class="organize-btn" id="organizeBtn" title="Organizar Arquivos">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="21 8 21 21 3 21 3 8"></polyline>
                    <rect x="1" y="3" width="22" height="5"></rect>
                    <line x1="10" y1="12" x2="14" y2="12"></line>
                </svg>
                Organizar
            </button>
            <button class="scan-btn" id="scanBtn" title="Escanear Pasta">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    <line x1="11" y1="8" x2="11" y2="14"></line>
                    <line x1="8" y1="11" x2="14" y2="11"></line>
                </svg>
                Escanear
            </button>
        </header>

        <main class="file-list" id="fileList">
            <!-- Items injected by JS -->
            <div style="grid-column: 1/-1; text-align: center; padding-top: 4rem;">
                <p>Iniciando sistema...</p>
            </div>
        </main>

        <!-- Modal for Scan Results -->
        <div class="modal-overlay" id="modalOverlay">
            <div class="modal">
                <div class="modal-header">
                    <h2 id="modalTitle">Análise da Pasta</h2>
                    <button class="close-btn" id="closeModal">&times;</button>
                </div>
                <div class="modal-body" id="scanResults">
                    <div id="loadingState">
                        <div id="loadingText" style="text-align: center; padding: 1rem;">Analizando...</div>
                        <div class="progress-container" id="progressContainer" style="display: block;">
                            <div class="progress-bar" id="progressBar"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <footer>
            <div id="stats">0 itens</div>
            <div class="status-tag">Sistema Ativo</div>
        </footer>
    </div>

    <script src="app.js"></script>
</body>

</html>
